name: Test and build Freedom Music Manager

on:
  push:
    branches: [main, music-migration]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate synthetic music demo
        run: |
          command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
          python3 scripts/generate_music_demo.py demo-music
      - name: Run music-specific regression and metadata tests
        run: node --test tests/music-*.test.mjs tests/unified-music-collections.test.mjs
      - name: Install Chromium integration tooling
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Test audio playback, metadata, collection persistence and layout
        run: |
          node scripts/capture-screenshots.mjs
          touch docs/screenshots/music-capture.ok
      - name: Build and verify application and demo ZIPs
        shell: bash
        run: |
          set -euo pipefail
          VERSION=v1.0.0-rc.2
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then VERSION="$GITHUB_REF_NAME"; fi
          python3 scripts/build_music_release.py "$VERSION"
          cd dist
          sha256sum -c SHA256SUMS.txt
          printf '### Verified packages\n\n' >> "$GITHUB_STEP_SUMMARY"
          ls -lh *.zip >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: freedom-music-manager-zips
          path: dist/
          if-no-files-found: error
          retention-days: 30

  publish-tagged-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-and-package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: freedom-music-manager-zips
          path: dist
      - name: Publish tested ZIP assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd dist
          sha256sum -c SHA256SUMS.txt
          args=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then args+=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" *.zip SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --verify-tag --title "Freedom Music Manager $GITHUB_REF_NAME" --generate-notes "${args[@]}"
